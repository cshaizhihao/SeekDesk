name: Verify release metadata
on:
  workflow_dispatch:
  pull_request:
    paths:
      - VERSION
      - BUILD_NUMBER
      - Distribution/Info.plist
      - Flutter/pubspec.yaml
      - 'docs/releases/**'
      - .github/workflows/release.yml
permissions:
  contents: read
jobs:
  metadata:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check versions and release notes
        run: |
          version="$(cat VERSION)"
          build="$(cat BUILD_NUMBER)"
          test "$version" = "$(plutil -extract CFBundleShortVersionString raw Distribution/Info.plist)"
          test "$build" = "$(plutil -extract CFBundleVersion raw Distribution/Info.plist)"
          test -s "docs/releases/v$version.md"
          if [[ -f Flutter/pubspec.yaml ]]; then
            grep -Fx "version: $version+$build" Flutter/pubspec.yaml
          fi
